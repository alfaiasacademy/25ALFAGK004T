                    "(C) தென்னாப்பிரிக்கா",
                    "(D) இந்தோனேசியா"
                ],
                answer: 2
            },
            {
                q: "97. 'சஷக்த் மற்றும் சுரக்ஷித் பாரத்: ஆயுதப்படைகளை மாற்றுதல்' என்ற தலைப்பில் ஆயுதப்படைகளின் முதல் இணைத் தளபதிகள் மாநாடு (JCC) செப்டம்பர் 2024 இல் எந்த இடத்தில் நடைபெற்றது?",
                options: [
                    "(A) காந்திநகர்",
                    "(B) லக்னோ",
                    "(C) போபால்",
                    "(D) பாட்னா"
                ],
                answer: 1
            },
            {
                q: "98. சமீபத்தில் செய்திகளில் காணப்பட்ட SAMRIDH திட்டம், எந்த அமைச்சகத்தின் முதன்மைத் திட்டமாகும்?",
                options: [
                    "(A) மின்னணுவியல் மற்றும் தகவல் தொழில்நுட்ப அமைச்சகம்",
                    "(B) புதிய மற்றும் புதுப்பிக்கத்தக்க எரிசக்தி அமைச்சகம்",
                    "(C) பூமி அறிவியல் அமைச்சகம்",
                    "(D) அறிவியல் மற்றும் தொழில்நுட்ப அமைச்சகம்"
                ],
                answer: 0
            },
            {
                q: "99. 2024 “சீன-ஆப்பிரிக்கா ஒத்துழைப்பு மன்றம் (FOCAC)” உச்சிமாநாடு ___ இல் நடைபெற்றது",
                options: [
                    "(A) பெய்ஜிங்",
                    "(B) தென்னாப்பிரிக்கா",
                    "(C) அங்கோலா",
                    "(D) ஷாங்காய்"
                ],
                answer: 0
            },
            {
                q: "100. கலத்தியா விரிகுடா, இந்தியாவின் எந்தத் தீவில் அமைந்துள்ளது?",
                options: [
                    "(A) மஜுலி தீவு",
                    "(B) கிரேட் நிக்கோபார் தீவு",
                    "(C) லட்சத்தீவு தீவு",
                    "(D) பாம்பன் தீவு"
                ],
                answer: 1
            }
        ];

        let currentQIndex = 0;
        let userAnswers = new Array(questions.length).fill(null);

        window.onload = function() {
            populateJumpDropdown();
            renderQuestion();
        };

        function populateJumpDropdown() {
            const select = document.getElementById('questionJump');
            select.innerHTML = '';
            for (let i = 0; i < questions.length; i++) {
                const opt = document.createElement('option');
                opt.value = i;
                opt.textContent = `கேள்வி ${i + 1}`;
                select.appendChild(opt);
            }
        }

        function renderQuestion() {
            const qData = questions[currentQIndex];
            
            // Update Headers & Controls
            document.getElementById('qNumber').textContent = `Q${currentQIndex + 1}`;
            document.getElementById('questionJump').value = currentQIndex;
            document.getElementById('questionText').textContent = qData.q;
            
            // Update Progress Bar
            const progPercent = ((currentQIndex + 1) / questions.length) * 100;
            document.getElementById('progressBar').style.width = `${progPercent}%`;

            // Navigation status
            document.getElementById('prevBtn').disabled = currentQIndex === 0;
            document.getElementById('nextBtn').disabled = currentQIndex === questions.length - 1;

            // Question Answered Status
            const answeredStatus = document.getElementById('answeredStatus');
            const selectedOpt = userAnswers[currentQIndex];
            
            if (selectedOpt !== null) {
                answeredStatus.textContent = "பதிலளிக்கப்பட்டது";
                answeredStatus.className = "text-xs font-semibold px-2.5 py-1 rounded-full bg-emerald-100 text-emerald-700";
            } else {
                answeredStatus.textContent = "பதிலளிக்கப்படவில்லை";
                answeredStatus.className = "text-xs font-semibold px-2.5 py-1 rounded-full bg-slate-100 text-slate-500";
            }

            // Render Options
            const container = document.getElementById('optionsContainer');
            container.innerHTML = '';

            qData.options.forEach((optText, idx) => {
                const optDiv = document.createElement('div');
                
                let borderStyle = "border-slate-200 hover:border-indigo-400 bg-white";
                let checkState = "";
                
                if (selectedOpt !== null) {
                    if (idx === selectedOpt) {
                        checkState = "checked";
                        if (idx === qData.answer) {
                            borderStyle = "border-emerald-500 bg-emerald-50 text-emerald-900";
                        } else {
                            borderStyle = "border-red-500 bg-red-50 text-red-900";
                        }
                    } else if (idx === qData.answer) {
                        borderStyle = "border-emerald-400 bg-emerald-50/50 text-slate-800";
                    }
                }

                optDiv.className = `option-card border-2 rounded-xl p-4 cursor-pointer transition-all flex items-center gap-3 ${borderStyle}`;
                optDiv.onclick = () => selectOption(idx);

                optDiv.innerHTML = `
                    <input type="radio" name="option" id="opt_${idx}" ${checkState} class="w-4 h-4 text-indigo-600 focus:ring-indigo-500 cursor-pointer" onclick="event.stopPropagation(); selectOption(${idx});">
                    <label for="opt_${idx}" class="cursor-pointer font-medium text-sm sm:text-base w-full">${optText}</label>
                `;
                container.appendChild(optDiv);
            });

            // Reveal Answer Box
            const answerBox = document.getElementById('answerBox');
            const answerHeader = document.getElementById('answerHeader');
            const correctAnswerText = document.getElementById('correctAnswerText');

            if (selectedOpt !== null) {
                answerBox.classList.remove('hidden');
                
                if (selectedOpt === qData.answer) {
                    answerBox.className = "mt-4 p-4 rounded-xl border bg-emerald-50 border-emerald-300 text-emerald-900";
                    answerHeader.innerHTML = `<i class="fa-solid fa-circle-check text-emerald-600"></i> <span class="text-emerald-800">சரியான பதில்!</span>`;
                } else {
                    answerBox.className = "mt-4 p-4 rounded-xl border bg-red-50 border-red-300 text-red-900";
                    answerHeader.innerHTML = `<i class="fa-solid fa-circle-xmark text-red-600"></i> <span class="text-red-800">தவறான பதில்</span>`;
                }

                correctAnswerText.innerHTML = `<strong>சரியான பதில்:</strong> ${qData.options[qData.answer]}`;
            } else {
                answerBox.classList.add('hidden');
            }

            updateScore();
        }

        function selectOption(index) {
            userAnswers[currentQIndex] = index;
            renderQuestion();
        }

        function updateScore() {
            let score = 0;
            userAnswers.forEach((ans, idx) => {
                if (ans === questions[idx].answer) {
                    score++;
                }
            });
            document.getElementById('scoreDisplay').textContent = score;
        }

        // Navigation
        function nextQuestion() {
            if (currentQIndex < questions.length - 1) {
                currentQIndex++;
                renderQuestion();
            }
        }

        function prevQuestion() {
            if (currentQIndex > 0) {
                currentQIndex--;
                renderQuestion();
            }
        }

        function jumpToQuestion(idx) {
            currentQIndex = parseInt(idx);
            renderQuestion();
        }

        function resetQuiz() {
            if (confirm("தேர்வை மீண்டும் தொடக்க விரும்புகிறீர்களா? உங்களின் பதில்கள் அழிக்கப்படும்.")) {
                userAnswers = new Array(questions.length).fill(null);
                currentQIndex = 0;
                renderQuestion();
            }
        }
    </script>
</body>
</html>
